[project]
name = "misalignment_bon"
version = "0.1.0"
description = "agentic_misalignment perturbation evals"
readme = "README.md"
authors = [
    { name = "Gunnar Vartdal", email = "gunnarvartdal@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "inspect-ai>=0.3.273",
    "inspect-evals>=0.22.0",
    "openai>=3.22.1",
    "pytest>=9.1.1",
]

[project.scripts]
evals = "evals:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
